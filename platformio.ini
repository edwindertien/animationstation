; Animation Station - PlatformIO project for Arduino Mega ADK
; Build:   pio run
; Upload:  pio run -t upload
; Monitor: pio device monitor        (115200 baud, shows what is sent to the servos)
[env:megaADK]
platform = atmelavr
board = megaADK
framework = arduino
monitor_speed = 115200

; Tell the USB Host Shield library that the MAX3421E is built into the board
; (INT = pin 54, RESET = pin 55). The megaADK board definition normally does this
; already (ARDUINO_AVR_ADK); defining it here makes it independent of that.
build_flags =
    -DBOARD_MEGA_ADK
    ; -DXTOUCH            ; uncomment for a Behringer X-Touch panel
    ; -DNO_SERVOSHIELD    ; uncomment to drive 8 servos directly on pins 24..31 via Servo.h

lib_deps =
    https://github.com/felis/USB_Host_Shield_2.0.git#1.7.0
    adafruit/Adafruit PWM Servo Driver Library @ ^3.0.0
    adafruit/Adafruit BusIO @ ^1.17.0
